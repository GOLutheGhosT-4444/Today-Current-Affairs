name: 2 TCA Filter Pipeline

on:
  workflow_dispatch:
  workflow_call:     

concurrency:
  group: filter-group
  cancel-in-progress: true

jobs:
  run-filter:
    runs-on: ubuntu-latest

    permissions:
      contents: write 
      actions: write

    env:
      # 🔐 Sirf Kaggle Secrets Chahiye
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install kaggle jq

      - name: 📝 Run Kaggle Filter Engine
        run: |
          if [ -f Data/1.json ]; then
            COUNT=$(jq '. | length' Data/1.json 2>/dev/null || echo "0")
            if [ "$COUNT" -gt "0" ]; then
              echo "🚀 Found $COUNT articles in Data/1.json! Delegating task to Kaggle GPU..."
              python Python/filter.py
            else
              echo "🤷‍♂️ Data/1.json is empty. Skipping Python/filter.py."
            fi
          else
            echo "🤷‍♂️ Data/1.json not found. Skipping."
          fi

      - name: 💾 Commit and Push Changes Smoothly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Kaggle se aayi hui nayi 2.json ko add karega
          git add Data/2.json || true
          
          if git diff --staged --quiet; then
            echo "✅ Koi naya filtered data nahi aaya, push skip kar rahe hain."
          else
            git commit -m "⚙️ Auto-update: AI Filtered articles generated on Kaggle GPU"
            git pull origin ${GITHUB_REF} --rebase
            git push origin HEAD:${GITHUB_REF}
            echo "🎉 Filtered data successfully repository me push ho gaya!"
          fi

      - name: 🔗 Trigger Cleaner Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Filter process done. Ab cleaner.yml trigger kar rahe hain..."
          gh workflow run cleaner.yml
